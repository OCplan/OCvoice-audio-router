name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      engine_version:
        description: "OCvoice engine release tag, or latest"
        required: false
        default: "latest"
        type: string

env:
  ENGINE_VERSION: ${{ inputs.engine_version || vars.ENGINE_VERSION || 'latest' }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: OCvoice-Audio-Router-macOS-arm64
            binary: ocvoice-audio-router
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: OCvoice-Audio-Router-macOS-x64
            binary: ocvoice-audio-router
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: OCvoice-Audio-Router-Windows
            binary: ocvoice-audio-router.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Fetch macOS engine and ffmpeg
        if: runner.os == 'macOS'
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ secrets.OCVOICE_RELEASE_TOKEN }}
          FFMPEG_URL_ARM64: ${{ vars.FFMPEG_URL_ARM64 || 'https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-arm64.gz' }}
          FFMPEG_URL_X64: ${{ vars.FFMPEG_URL_X64 || 'https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-x64.gz' }}
          FFMPEG_SHA256_ARM64: ${{ vars.FFMPEG_SHA256_ARM64 }}
          FFMPEG_SHA256_X64: ${{ vars.FFMPEG_SHA256_X64 }}
        run: |
          set -euo pipefail
          DEPS_DIR="${PWD}/.release-sidecars"
          rm -rf "${DEPS_DIR}"
          mkdir -p "${DEPS_DIR}"

          case "${BUILD_TARGET}" in
            aarch64-apple-darwin)
              ENGINE_ASSET="ocvoice-restream-engine-darwin-arm64"
              FFMPEG_URL="${FFMPEG_URL_ARM64}"
              FFMPEG_SHA256="${FFMPEG_SHA256_ARM64}"
              ;;
            x86_64-apple-darwin)
              ENGINE_ASSET="ocvoice-restream-engine-darwin-x64"
              FFMPEG_URL="${FFMPEG_URL_X64}"
              FFMPEG_SHA256="${FFMPEG_SHA256_X64}"
              ;;
            *)
              echo "Unsupported macOS build target: ${BUILD_TARGET}" >&2
              exit 1
              ;;
          esac

          if [[ "${ENGINE_VERSION}" == "latest" ]]; then
            gh release download --repo OCplan/OCvoice \
              --pattern "${ENGINE_ASSET}" --dir "${DEPS_DIR}"
          else
            gh release download "${ENGINE_VERSION}" --repo OCplan/OCvoice \
              --pattern "${ENGINE_ASSET}" --dir "${DEPS_DIR}"
          fi
          mv "${DEPS_DIR}/${ENGINE_ASSET}" "${DEPS_DIR}/ocvoice-restream-engine"

          # NOTE: the eugeneware default is --enable-nonfree and will be REJECTED by
          # the gate below — set repo vars FFMPEG_URL_ARM64/X64 to a GPL (non-nonfree)
          # TLS static build before a real release (GPL-3.0 app → GPL ffmpeg is fine).
          curl --fail --location --retry 3 "${FFMPEG_URL}" --output "${DEPS_DIR}/ffmpeg.gz"
          if [[ -n "${FFMPEG_SHA256}" ]]; then
            printf '%s  %s\n' "${FFMPEG_SHA256}" "${DEPS_DIR}/ffmpeg.gz" | shasum -a 256 --check
          fi
          gzip -dc "${DEPS_DIR}/ffmpeg.gz" > "${DEPS_DIR}/ffmpeg"
          chmod +x "${DEPS_DIR}/ocvoice-restream-engine" "${DEPS_DIR}/ffmpeg"

          # Fail-closed distribution + capability gate. A --enable-nonfree ffmpeg
          # is NOT redistributable (bundling it would violate its license); the
          # engine also needs rtmps/TLS to push to YouTube. Point FFMPEG_URL_* at
          # a GPL (non-nonfree) static build if this fails.
          if "${DEPS_DIR}/ffmpeg" -hide_banner -version 2>/dev/null | grep -q -- "--enable-nonfree"; then
            echo "::error::bundled ffmpeg is --enable-nonfree (not redistributable); set FFMPEG_URL_ARM64/X64 to a GPL build"; exit 1
          fi
          if ! "${DEPS_DIR}/ffmpeg" -hide_banner -protocols 2>/dev/null | grep -qi "rtmps"; then
            echo "::error::bundled ffmpeg lacks rtmps/TLS; the YouTube push would fail"; exit 1
          fi

      # macOS: create .app bundle, sign, notarize, create .dmg
      - name: Create macOS .app and .dmg
        if: runner.os == 'macOS'
        shell: bash
        env:
          ARTIFACT_NAME: ${{ matrix.artifact }}
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_BINARY: ${{ matrix.binary }}
          TAG_NAME: ${{ github.ref_name }}
          APPLE_DEVELOPER_ID_CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          APP_NAME="OCvoice Audio Router.app"
          VERSION=""
          if [[ "${TAG_NAME}" == v* ]]; then
            VERSION="${TAG_NAME#v}"
          fi

          # --- Code Signing ---
          if [[ -n "${APPLE_DEVELOPER_ID_CERT_BASE64}" ]]; then
            echo "Setting up code signing..."

            # Create temporary keychain
            KEYCHAIN_PATH="${RUNNER_TEMP}/app-signing.keychain-db"
            KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
            security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
            security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
            security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

            # Import certificate
            CERT_PATH="${RUNNER_TEMP}/certificate.p12"
            echo "${APPLE_DEVELOPER_ID_CERT_BASE64}" | base64 --decode > "${CERT_PATH}"
            security import "${CERT_PATH}" \
              -P "${APPLE_DEVELOPER_ID_CERT_PASSWORD}" \
              -A \
              -t cert \
              -f pkcs12 \
              -k "${KEYCHAIN_PATH}"
            security set-key-partition-list -S apple-tool:,apple: -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
            security list-keychains -d user -s "${KEYCHAIN_PATH}" login.keychain

            # Find signing identity
            IDENTITY=$(security find-identity -v -p codesigning "${KEYCHAIN_PATH}" | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
            echo "Signing with identity: ${IDENTITY}"

            SIGNING_IDENTITY="${IDENTITY}" \
              ENGINE_BINARY="${PWD}/.release-sidecars/ocvoice-restream-engine" \
              FFMPEG_BINARY="${PWD}/.release-sidecars/ffmpeg" \
              ROUTER_BINARY="target/${BUILD_TARGET}/release/${BUILD_BINARY}" \
              APP_NAME="${APP_NAME}" \
              APP_VERSION="${VERSION}" \
              bash scripts/bundle-macos.sh

            # --- Create DMG ---
            mkdir -p dmg_contents
            cp -R "${APP_NAME}" dmg_contents/
            ln -s /Applications dmg_contents/Applications

            hdiutil create -volname "OCvoice Audio Router" \
              -srcfolder dmg_contents \
              -ov -format UDZO \
              "${ARTIFACT_NAME}.dmg"

            # Sign the DMG
            codesign --force --sign "${IDENTITY}" --timestamp "${ARTIFACT_NAME}.dmg"

            # --- Notarization via App Store Connect API key ---
            if [[ -n "${APPLE_API_KEY_BASE64}" ]]; then
              echo "Setting up App Store Connect API key..."
              API_KEY_DIR="${RUNNER_TEMP}/private_keys"
              mkdir -p "${API_KEY_DIR}"
              echo "${APPLE_API_KEY_BASE64}" | base64 --decode > "${API_KEY_DIR}/AuthKey_${APPLE_API_KEY_ID}.p8"

              echo "Submitting for notarization..."
              xcrun notarytool submit "${ARTIFACT_NAME}.dmg" \
                --key "${API_KEY_DIR}/AuthKey_${APPLE_API_KEY_ID}.p8" \
                --key-id "${APPLE_API_KEY_ID}" \
                --issuer "${APPLE_API_ISSUER_ID}" \
                --wait

              echo "Stapling notarization ticket..."
              xcrun stapler staple "${ARTIFACT_NAME}.dmg"

              rm -rf "${API_KEY_DIR}"
            fi

            # Clean up keychain
            security delete-keychain "${KEYCHAIN_PATH}"
          else
            echo "No signing certificate found, creating ad-hoc signed app and unsigned DMG..."
            ENGINE_BINARY="${PWD}/.release-sidecars/ocvoice-restream-engine" \
              FFMPEG_BINARY="${PWD}/.release-sidecars/ffmpeg" \
              ROUTER_BINARY="target/${BUILD_TARGET}/release/${BUILD_BINARY}" \
              APP_NAME="${APP_NAME}" \
              APP_VERSION="${VERSION}" \
              bash scripts/bundle-macos.sh

            mkdir -p dmg_contents
            cp -R "${APP_NAME}" dmg_contents/
            ln -s /Applications dmg_contents/Applications

            hdiutil create -volname "OCvoice Audio Router" \
              -srcfolder dmg_contents \
              -ov -format UDZO \
              "${ARTIFACT_NAME}.dmg"
          fi

      - name: Fetch Windows engine and ffmpeg
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.OCVOICE_RELEASE_TOKEN }}
          FFMPEG_URL_WIN: ${{ vars.FFMPEG_URL_WIN || 'https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-win32-x64.gz' }}
          FFMPEG_SHA256_WIN: ${{ vars.FFMPEG_SHA256_WIN }}
        run: |
          set -euo pipefail
          DEPS_DIR="${PWD}/.release-sidecars"
          ENGINE_ASSET="ocvoice-restream-engine-windows-x64.exe"
          rm -rf "${DEPS_DIR}"
          mkdir -p "${DEPS_DIR}"

          if [[ "${ENGINE_VERSION}" == "latest" ]]; then
            gh release download --repo OCplan/OCvoice \
              --pattern "${ENGINE_ASSET}" --dir "${DEPS_DIR}"
          else
            gh release download "${ENGINE_VERSION}" --repo OCplan/OCvoice \
              --pattern "${ENGINE_ASSET}" --dir "${DEPS_DIR}"
          fi
          mv "${DEPS_DIR}/${ENGINE_ASSET}" "${DEPS_DIR}/ocvoice-restream-engine.exe"

          # NOTE: the eugeneware default is --enable-nonfree and will be REJECTED by
          # the gate below — set repo var FFMPEG_URL_WIN to a GPL (non-nonfree) TLS
          # static build before a real release.
          curl --fail --location --retry 3 "${FFMPEG_URL_WIN}" --output "${DEPS_DIR}/ffmpeg.gz"
          if [[ -n "${FFMPEG_SHA256_WIN}" ]]; then
            printf '%s  %s\n' "${FFMPEG_SHA256_WIN}" "${DEPS_DIR}/ffmpeg.gz" | sha256sum --check
          fi
          gzip -dc "${DEPS_DIR}/ffmpeg.gz" > "${DEPS_DIR}/ffmpeg.exe"

          # Fail-closed distribution + capability gate (see the macOS step):
          # reject a non-redistributable --enable-nonfree build, require rtmps/TLS.
          if "${DEPS_DIR}/ffmpeg.exe" -hide_banner -version 2>/dev/null | grep -q -- "--enable-nonfree"; then
            echo "::error::bundled ffmpeg is --enable-nonfree (not redistributable); set FFMPEG_URL_WIN to a GPL build"; exit 1
          fi
          if ! "${DEPS_DIR}/ffmpeg.exe" -hide_banner -protocols 2>/dev/null | grep -qi "rtmps"; then
            echo "::error::bundled ffmpeg lacks rtmps/TLS; the YouTube push would fail"; exit 1
          fi

      # Windows: bundle the router and its sidecars in one zip.
      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: bash
        env:
          ARTIFACT_NAME: ${{ matrix.artifact }}
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_BINARY: ${{ matrix.binary }}
        run: |
          mkdir -p "${ARTIFACT_NAME}"
          cp "target/${BUILD_TARGET}/release/${BUILD_BINARY}" "${ARTIFACT_NAME}/${BUILD_BINARY}"
          cp ".release-sidecars/ocvoice-restream-engine.exe" "${ARTIFACT_NAME}/ocvoice-restream-engine.exe"
          cp ".release-sidecars/ffmpeg.exe" "${ARTIFACT_NAME}/ffmpeg.exe"
          powershell.exe -NoProfile -Command \
            "Compress-Archive -Path '${ARTIFACT_NAME}' -DestinationPath '${ARTIFACT_NAME}.zip' -Force"

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: "${{ matrix.artifact }}.dmg"

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: "${{ matrix.artifact }}.zip"

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Audio Router ${{ github.ref_name }}"
          body: |
            ## OCvoice Audio Router

            Download the right version for your system:

            | Platform | File |
            |---|---|
            | **macOS (Apple Silicon — M1/M2/M3/M4)** | `OCvoice-Audio-Router-macOS-arm64.dmg` |
            | **macOS (Intel)** | `OCvoice-Audio-Router-macOS-x64.dmg` |
            | **Windows** | `OCvoice-Audio-Router-Windows.zip` |

            ### macOS
            1. Download and open the `.dmg` file
            2. Drag **OCvoice Audio Router** to the **Applications** folder
            3. Double-click to launch — the app runs in the background via the menu bar

            ### Windows
            1. Download and extract the `.zip` file
            2. Run `ocvoice-audio-router.exe` inside the extracted folder
            3. Click "More info" → "Run anyway" if SmartScreen blocks it
            4. Done — starts automatically on login

            The app runs in the background. Your OCvoice broadcast page detects it automatically.
          files: artifacts/**/*
